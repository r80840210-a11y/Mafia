<!DOCTYPE html>
<html lang="ru">
<head>

    <title>StandFade Web App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;

            justify-content: center;
            align-items: center;
            height: 100vh;
