databases:
  - name: mafia-db
    plan: free
    databaseName: mafia
    user: mafia
services:
  - type: web
    name: mafia-online
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mafia-db
          property: connectionString
